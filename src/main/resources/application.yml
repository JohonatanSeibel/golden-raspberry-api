spring:
  datasource:
    url: jdbc:h2:mem:raspberry;DB_CLOSE_DELAY=-1
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}

app:
  csv:
    path: ${APP_CSV_PATH:classpath:data/movielist.csv}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
